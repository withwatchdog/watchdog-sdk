[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-agent-sdk"
version = "0.1.0"
description = "Fail-open reliability monitoring for unattended agent jobs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai-agents==0.8.4", "openai==2.19.0"]

[tool.setuptools.packages.find]
include = ["watchdog_agent*"]
