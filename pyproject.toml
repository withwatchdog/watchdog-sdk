[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-agent-sdk"
version = "0.1.0"
description = "Fail-open reliability monitoring for unattended agent jobs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Watchdog Limited"}]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://withwatchdog.com"
Documentation = "https://withwatchdog.com/docs/quickstart"
Repository = "https://github.com/withwatchdog/watchdog-sdk"
Issues = "https://github.com/withwatchdog/watchdog-sdk/issues"

[project.optional-dependencies]
openai = ["openai-agents==0.8.4", "openai==2.19.0"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["watchdog_agent*"]
namespaces = false
