[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-agent-sdk"
version = "0.2.0"
description = "Fail-open reliability monitoring for unattended agent jobs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Watchdog Limited"}]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://withwatchdog.com"
Documentation = "https://withwatchdog.com/docs/quickstart"
Repository = "https://github.com/withwatchdog/watchdog-sdk"
Issues = "https://github.com/withwatchdog/watchdog-sdk/issues"

[project.optional-dependencies]
openai = ["openai-agents==0.22.0", "openai==3.8.0"]
claude = ["claude-agent-sdk==0.2.152"]
langgraph = ["langgraph==1.2.11", "langchain-core==1.6.2"]
pydanticai = ["pydantic-ai-slim==2.40.0"]
dev = ["ruff==0.16.6", "mypy==2.3.1", "build>=1.2,<2", "twine>=7,<8"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["watchdog_agent"]
follow_imports = "silent"
check_untyped_defs = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["watchdog_agent*"]
namespaces = false

[tool.setuptools.package-data]
watchdog_agent = ["py.typed"]
